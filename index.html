<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Retroyer — Juegos HTML5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Arial,sans-serif;background:#070a11;color:white}body{overflow-x:hidden}button,input{font:inherit}header{position:sticky;top:0;z-index:20;background:#0b101af2;backdrop-filter:blur(15px);border-bottom:1px solid #202b3d}.nav{max-width:1400px;margin:auto;padding:15px 20px;display:flex;align-items:center;gap:20px}.logo{font-size:28px;font-weight:900;color:#00eaff}.logo span{color:white}.search{flex:1}.search input{width:100%;padding:13px 17px;border-radius:12px;border:1px solid #29364b;background:#111722;color:white;outline:none}.search input:focus{border-color:#00eaff}.hero{max-width:1400px;margin:25px auto;padding:55px 30px;border-radius:22px;background:radial-gradient(circle at 80% 20%,#0066ff55,transparent 35%),radial-gradient(circle at 20% 80%,#00eaff25,transparent 35%),#101827}.hero h1{font-size:clamp(40px,7vw,75px);margin:0 0 10px}.hero h1 span{color:#00eaff}.hero p{color:#98a6bb;font-size:18px}.categories{max-width:1400px;margin:auto;padding:0 20px 25px;display:flex;gap:9px;overflow-x:auto}.category{border:1px solid #29364b;background:#111722;color:#aab7c9;border-radius:30px;padding:10px 16px;cursor:pointer;white-space:nowrap}.category.active,.category:hover{background:#00eaff;color:#001014}.content{max-width:1400px;margin:auto;padding:0 20px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}#count{color:#748197}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}.card{background:#111722;border:1px solid #202c3e;border-radius:15px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-5px);border-color:#00eaff}.cover{height:125px;display:grid;place-items:center;font-size:55px;background:linear-gradient(135deg,#16253b,#0b1019)}.info{padding:13px}.info h3{margin:0}.info p{margin:7px 0 0;color:#718098;font-size:13px}.tag{display:inline-block;margin-top:9px;padding:4px 8px;border-radius:6px;background:#1a2638;color:#91a3bd;font-size:11px}#player{display:none;position:fixed;inset:0;z-index:100;background:#05070c;padding:10px}.playerBox{width:min(1100px,100%);height:100%;margin:auto;display:flex;flex-direction:column}.playerHead{min-height:48px;display:flex;justify-content:space-between;align-items:center}.close{border:0;border-radius:9px;background:#1b2535;color:white;padding:9px 15px;cursor:pointer}.gameCanvas{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}canvas{width:min(800px,100%);height:auto;aspect-ratio:800/500;background:#05070b;border:1px solid #27354a;border-radius:12px;touch-action:none}.controlsText{text-align:center;padding:7px;color:#8391a6;font-size:13px}.touchControls{display:none;width:min(420px,100%);margin:auto;padding:8px 5px 12px;user-select:none}.touchGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:230px;margin:auto}.touchBtn,.actionBtn{min-height:58px;border:1px solid #34445c;border-radius:14px;background:#172236;color:white;font-size:25px;cursor:pointer;touch-action:none}.touchBtn:active,.actionBtn:active{background:#00eaff;color:#001014;transform:scale(.95)}.touchBtn.empty{visibility:hidden}.actionRow{display:flex;justify-content:center;gap:12px;margin-top:8px}.actionBtn{min-width:130px}@media(max-width:700px){header{position:relative}.nav{flex-wrap:wrap;padding:12px}.logo{width:100%}.hero{margin:15px 10px;padding:35px 20px}.hero p{font-size:15px}.content,.categories{padding-left:10px;padding-right:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cover{height:95px;font-size:43px}.info{padding:10px}.info h3{font-size:14px}.playerHead{padding:3px}.gameCanvas{flex:none;width:100%}.touchControls{display:block}#player{padding:5px}.controlsText{font-size:11px}}@media(min-width:701px){.touchControls{display:none!important}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">RETRO<span>YER</span></div><div class="search"><input id="search" placeholder="🔎 Buscar juegos..."></div></div></header>
<section class="hero"><h1>Juega <span>sin límites.</span></h1><p>Juegos HTML5 para PC, Android y iPhone.</p></section>
<div class="categories"><button class="category active" data-cat="Todos">🔥 Todos</button><button class="category" data-cat="Arcade">🕹️ Arcade</button><button class="category" data-cat="Acción">⚡ Acción</button><button class="category" data-cat="Puzzle">🧩 Puzzle</button><button class="category" data-cat="Clásicos">👾 Clásicos</button></div>
<main class="content"><div class="top"><h2>🎮 Juegos</h2><span id="count"></span></div><div class="grid" id="grid"></div></main>
<div id="player"><div class="playerBox"><div class="playerHead"><strong id="gameTitle">Juego</strong><button class="close" id="close">✕ Cerrar</button></div><div class="gameCanvas"><canvas id="canvas" width="800" height="500"></canvas></div><div class="controlsText" id="controlsText"></div><div class="touchControls"><div class="touchGrid"><button class="touchBtn empty">•</button><button class="touchBtn" data-key="up">▲</button><button class="touchBtn empty">•</button><button class="touchBtn" data-key="left">◀</button><button class="touchBtn" data-key="down">▼</button><button class="touchBtn" data-key="right">▶</button></div><div class="actionRow"><button class="actionBtn" data-key="space">🚀 DISPARAR</button></div></div></div></div>
<script>
const baseGames=[
 ['Snake','Clásicos','🐍','snake'],['Pong','Clásicos','🏓','pong'],['Dodge','Arcade','💥','dodge'],['Clicker','Puzzle','🖱️','clicker'],['Space Shooter','Acción','🚀','space']
];
const extraNames=['Astro Blast','Neon Runner','Pixel Quest','Turbo Racer','Block Master','Color Match','Galaxy Defender','Meteor Rush','Dungeon Hero','Jewel Drop','Sky Fighter','Road Fury','Cyber Ninja','Fruit Slice','Memory Cards','Brick Breaker','Laser Jump','Star Catcher','Robot Arena','Bubble Pop','Castle Run','Alien Attack','Mini Golf','Tank Battle','Word Puzzle','Fire Jump','Ocean Dash','Maze Escape','Zombie Street','Rocket Pilot','Drift King','Snow Ride','Candy Crush','Tower Defense','Pixel Soccer','Air Hockey','Gem Hunter','Magic Blocks','Monster Dash','Space Race','Retro Tennis','Ninja Run','Farm Match','Dragon Quest','Helicopter War','Coin Collector','Asteroid Field','Cosmic Jump','Speed Bike','Boxing Ring','Paint Puzzle','Lunar Landing','Pirate Bay','Samurai Duel','Cave Explorer','Tetris Classic','Bomber Zone','Pinball Retro','Fishing Time','Kart Rush','Kingdom Fight','Virus Attack','Ice Climber','Desert Rally','Robot Rescue','Fruit Catch','Arcade Golf','Mystery Doors','Battle Ships','Circuit Race','Alien Maze','Power Hoops','Dragon Flight','Crystal Quest','Rocket Defense','Pixel Farm','Shadow Strike','Laser Grid','Monster Match','Volcano Run','Space Invaders','Retro Rally','Cyber Blocks','Jungle Dash','Moon Patrol','Cosmic Defender','Speed Ball','Treasure Cave','Neon Tennis','Fire Defender','Bubble Shooter','Castle Defense','Galactic War','Puzzle Lines','Hero Jump','Pixel Brawl','Astro Racer','Magic Tower'];
const icons=['🎮','👾','🚀','⚡','🧩','🏎️','🤖','🌌','💎','🔥'];
const cats=['Arcade','Acción','Puzzle','Clásicos'];
const games=baseGames.concat(extraNames.map((name,i)=>({name,cat:cats[i%cats.length],icon:icons[i%icons.length],type:['dodge','clicker','space'][i%3]})));
const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count'),player=document.getElementById('player'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),controlsText=document.getElementById('controlsText');let category='Todos',animation=0,keys={up:false,down:false,left:false,right:false,space:false};
function render(){const q=search.value.toLowerCase();const result=games.filter(g=>(category==='Todos'||g.cat===category)&&g.name.toLowerCase().includes(q));grid.innerHTML='';result.forEach(g=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="cover">${g.icon}</div><div class="info"><h3>${g.name}</h3><p>HTML5 • PC + móvil</p><span class="tag">${g.cat}</span></div>`;card.onclick=()=>openGame(g);grid.appendChild(card)});count.textContent=result.length+' juegos'}
function openGame(game){player.style.display='block';document.getElementById('gameTitle').textContent=game.name;cancelAnimationFrame(animation);canvas.onclick=null;if(game.type==='snake')snake();else if(game.type==='pong')pong();else if(game.type==='clicker')clicker();else if(game.type==='space')space();else dodge()}
function closeGame(){player.style.display='none';cancelAnimationFrame(animation);canvas.onclick=null;ctx.clearRect(0,0,canvas.width,canvas.height);keys={up:false,down:false,left:false,right:false,space:false}}
document.getElementById('close').onclick=closeGame;
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(e.key==='ArrowUp'||k==='w')keys.up=true;if(e.key==='ArrowDown'||k==='s')keys.down=true;if(e.key==='ArrowLeft'||k==='a')keys.left=true;if(e.key==='ArrowRight'||k==='d')keys.right=true;if(e.code==='Space'){e.preventDefault();keys.space=true}if(e.key==='Escape')closeGame()});document.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(e.key==='ArrowUp'||k==='w')keys.up=false;if(e.key==='ArrowDown'||k==='s')keys.down=false;if(e.key==='ArrowLeft'||k==='a')keys.left=false;if(e.key==='ArrowRight'||k==='d')keys.right=false;if(e.code==='Space')keys.space=false});document.querySelectorAll('.touchBtn,.actionBtn').forEach(button=>{const key=button.dataset.key;const set=e=>{e.preventDefault();if(key)keys[key]=true};const clear=e=>{e.preventDefault();if(key)keys[key]=false};button.addEventListener('pointerdown',set);['pointerup','pointercancel','pointerleave'].forEach(type=>button.addEventListener(type,clear))});
function frame(draw,text){controlsText.textContent=text;function loop(){animation=requestAnimationFrame(loop);draw()}loop()}
function snake(){let x=400,y=250;frame(()=>{if(keys.up)y-=4;if(keys.down)y+=4;if(keys.left)x-=4;if(keys.right)x+=4;x=Math.max(10,Math.min(790,x));y=Math.max(10,Math.min(490,y));ctx.fillStyle='#05070b';ctx.fillRect(0,0,800,500);ctx.fillStyle='#00eaff';ctx.fillRect(x-10,y-10,20,20)},'PC: WASD/Flechas • Móvil: botones')}
function pong(){let y=210,ballX=400,ballY=240,vx=4,vy=3;frame(()=>{if(keys.up)y-=7;if(keys.down)y+=7;y=Math.max(0,Math.min(420,y));ballX+=vx;ballY+=vy;if(ballY<0||ballY>480)vy*=-1;if(ballX<45&&ballY>y&&ballY<y+80)vx=Math.abs(vx);if(ballX>780)vx=-Math.abs(vx);ctx.fillStyle='#05070b';ctx.fillRect(0,0,800,500);ctx.fillStyle='#00eaff';ctx.fillRect(20,y,20,80);ctx.fillStyle='white';ctx.fillRect(760,240,20,80);ctx.beginPath();ctx.arc(ballX,ballY,10,0,Math.PI*2);ctx.fill()},'PC: W/S • Móvil: ▲/▼')}
function dodge(){let x=380;frame(()=>{if(keys.left)x-=7;if(keys.right)x+=7;x=Math.max(0,Math.min(760,x));ctx.fillStyle='#05070b';ctx.fillRect(0,0,800,500);ctx.fillStyle='#00eaff';ctx.fillRect(x,450,40,25);ctx.fillStyle='#ff4050';ctx.fillRect(380,120,25,25)},'PC: A/D • Móvil: ◀/▶')}
function clicker(){let score=0;function draw(){ctx.fillStyle='#05070b';ctx.fillRect(0,0,800,500);ctx.fillStyle='white';ctx.font='30px Arial';ctx.fillText('Puntos: '+score,30,50);ctx.fillStyle='#00eaff';ctx.beginPath();ctx.arc(400,250,70,0,Math.PI*2);ctx.fill()}canvas.onclick=()=>{score++;draw()};controlsText.textContent='Toca el círculo para conseguir puntos';draw()}
function space(){let x=380;frame(()=>{if(keys.left)x-=6;if(keys.right)x+=6;x=Math.max(0,Math.min(760,x));ctx.fillStyle='#05070b';ctx.fillRect(0,0,800,500);ctx.fillStyle='#00eaff';ctx.fillRect(x,450,40,25);ctx.fillStyle='#ff4050';ctx.fillRect(350,100,30,30)},'PC: A/D + ESPACIO • Móvil: botones')}
document.querySelectorAll('.category').forEach(button=>button.onclick=()=>{category=button.dataset.cat;document.querySelectorAll('.category').forEach(b=>b.classList.remove('active'));button.classList.add('active');render()});search.addEventListener('input',render);render();
</script>
</body>
</html>

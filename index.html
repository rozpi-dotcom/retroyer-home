<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Retroyer — EmulatorJS</title>
<style>
:root {
    --bg: #070a11;
    --bg-2: #0f1727;
    --panel: #121c2d;
    --panel-2: #17263b;
    --line: #27354d;
    --cyan: #00eaff;
    --cyan-soft: rgba(0, 234, 255, 0.18);
    --text: #eef5ff;
    --muted: #96a8c2;
    --success: #32e0a1;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

body {
    overflow-x: hidden;
}

button, input, select {
    font: inherit;
}

header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(11, 16, 26, 0.95);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid var(--line);
}

.nav {
    max-width: 1400px;
    margin: auto;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
}

.logo {
    font-size: 28px;
    font-weight: 900;
    color: var(--cyan);
    letter-spacing: 1px;
}

.logo span {
    color: white;
}

.hero {
    max-width: 1400px;
    margin: 25px auto 0;
    padding: 55px 30px;
    border-radius: 22px;
    background:
        radial-gradient(circle at 80% 20%, rgba(0, 102, 255, 0.4), transparent 35%),
        radial-gradient(circle at 20% 80%, rgba(0, 234, 255, 0.2), transparent 35%),
        var(--bg-2);
    border: 1px solid var(--line);
}

.hero h1 {
    margin: 0 0 10px;
    font-size: clamp(40px, 7vw, 72px);
    line-height: 1.05;
}

.hero h1 span {
    color: var(--cyan);
}

.hero p {
    margin: 0;
    color: var(--muted);
    font-size: 18px;
}

.content {
    max-width: 1400px;
    margin: auto;
    padding: 30px 20px 70px;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 18px;
}

.upload {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 18px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    font-weight: 700;
}

.upload input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
}

select, .launch {
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
}

.launch {
    background: var(--cyan);
    border-color: var(--cyan);
    color: #041115;
    font-weight: 900;
    cursor: pointer;
}

.status {
    margin-bottom: 20px;
    color: var(--muted);
    font-size: 14px;
}

.emulator-shell {
    background: #060b13;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 12px;
    min-height: 560px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.32);
}

#emulator {
    width: 100%;
    min-height: 530px;
    background: linear-gradient(180deg, #03070d, #050b12);
    border-radius: 12px;
    overflow: hidden;
}

.empty-state {
    display: grid;
    place-items: center;
    min-height: 530px;
    color: var(--muted);
    text-align: center;
    padding: 30px;
}

@media (max-width: 700px) {
    .nav {
        flex-wrap: wrap;
        padding: 12px;
    }

    .logo {
        width: 100%;
    }

    .hero {
        margin: 15px 10px 0;
        padding: 35px 20px;
    }

    .content {
        padding-left: 10px;
        padding-right: 10px;
    }

    .toolbar {
        flex-direction: column;
        align-items: stretch;
    }

    .toolbar > * {
        width: 100%;
    }

    .emulator-shell, #emulator {
        min-height: 420px;
    }
}
</style>
</head>
<body>

<header>
    <div class="nav">
        <div class="logo">RETRO<span>YER</span></div>
    </div>
</header>

<section class="hero">
    <h1>Juega <span>clásicos</span> con EmulatorJS.</h1>
    <p>Selecciona una ROM y lanza el emulador directamente en el navegador.</p>
</section>

<main class="content">
    <div class="toolbar">
        <label class="upload">
            <input id="romFile" type="file" accept=".zip,.nes,.smc,.sfc,.gba,.gb,.gbc,.gen,.md,.sms,.gg,.n64,.pce,.wad,.bin">
            <span>Seleccionar ROM</span>
        </label>

        <select id="consoleSelect" aria-label="Selecciona consola">
            <option value="nes">NES</option>
            <option value="snes">SNES</option>
            <option value="gb">Game Boy</option>
            <option value="gbc">Game Boy Color</option>
            <option value="gba">Game Boy Advance</option>
            <option value="genesis">Genesis</option>
            <option value="arcade">Arcade</option>
            <option value="sms">Master System</option>
            <option value="n64">N64</option>
        </select>

        <button class="launch" id="launchBtn">Lanzar emulador</button>
    </div>

    <div class="status" id="statusText">Sin ROM cargada. Elige un archivo .zip o .nes para empezar.</div>

    <div class="emulator-shell">
        <div id="emulator">
            <div class="empty-state">
                El emulador aparecerá aquí cuando selecciones una ROM.
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/loader.js"></script>
<script>
const romInput = document.getElementById('romFile');
const consoleSelect = document.getElementById('consoleSelect');
const launchBtn = document.getElementById('launchBtn');
const statusText = document.getElementById('statusText');
const emulatorRoot = document.getElementById('emulator');

const coreMap = {
    nes: 'nes',
    snes: 'snes',
    gb: 'gb',
    gbc: 'gbc',
    gba: 'gba',
    genesis: 'genesis',
    arcade: 'arcade',
    sms: 'sms',
    n64: 'n64'
};

function setEmptyState(message) {
    emulatorRoot.innerHTML = '<div class="empty-state">' + message + '</div>';
}

function launchEmulatorFromFile(file) {
    if (!file) {
        statusText.textContent = 'No se ha seleccionado ninguna ROM.';
        setEmptyState('No hay ROM cargada.');
        return;
    }

    const core = coreMap[consoleSelect.value] || 'nes';
    const url = URL.createObjectURL(file);

    statusText.textContent = 'Cargando ' + file.name + ' en ' + consoleSelect.value.toUpperCase() + '...';
    emulatorRoot.innerHTML = '';

    window.EJS_player = '#emulator';
    window.EJS_core = core;
    window.EJS_gameUrl = url;
    window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/';
    window.EJS_startOnLoaded = true;

    if (typeof window.EJS_load === 'function') {
        try {
            window.EJS_load();
            statusText.textContent = 'Emulador cargado: ' + file.name;
        } catch (err) {
            statusText.textContent = 'Error al iniciar el emulador. Revisa la consola.';
            setEmptyState('No se pudo iniciar EmulatorJS.');
        }
        return;
    }

    const loaderScript = document.createElement('script');
    loaderScript.src = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/loader.js';
    loaderScript.onload = () => {
        if (typeof window.EJS_load === 'function') {
            window.EJS_load();
            statusText.textContent = 'Emulador cargado: ' + file.name;
        }
    };
    loaderScript.onerror = () => {
        statusText.textContent = 'No se pudo cargar EmulatorJS desde la CDN.';
        setEmptyState('Error al cargar EmulatorJS.');
    };
    document.body.appendChild(loaderScript);
}

launchBtn.addEventListener('click', () => {
    const file = romInput.files[0];
    launchEmulatorFromFile(file);
});

romInput.addEventListener('change', () => {
    const file = romInput.files[0];
    if (file) {
        statusText.textContent = 'ROM lista: ' + file.name;
    }
});
</script>
</body>
</html>

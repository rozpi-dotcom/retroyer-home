<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Retroyer — Juegos Retro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b12;
            color: white;
            min-height: 100vh;
        }

        /* =========================
           BANNER DECO
        ========================= */

        .retroyer-banner {
            width: 100%;
            height: 260px;
            overflow: hidden;
            position: relative;

            background: #111;

            border-radius: 0 0 24px 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
        }

        .retroyer-banner iframe {
            width: 100%;
            height: 100%;

            border: none;
            display: block;

            overflow: hidden;
        }

        /* Oscurece ligeramente los bordes */
        .banner-overlay {
            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.05),
                    rgba(0, 0, 0, 0.25)
                );
        }

        /* =========================
           CONTENIDO
        ========================= */

        main {
            width: min(1200px, 94%);
            margin: 35px auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: clamp(35px, 7vw, 70px);
            font-weight: 900;
            letter-spacing: -3px;
        }

        .hero h1 span {
            color: #ffcc33;
        }

        .hero p {
            margin-top: 10px;
            color: #aaa;
            font-size: 18px;
        }

        /* =========================
           BUSCADOR
        ========================= */

        .search-box {
            display: flex;
            gap: 10px;

            max-width: 700px;
            margin: 0 auto 35px;
        }

        .search-box input {
            flex: 1;

            padding: 15px 18px;

            border: 1px solid #292936;
            border-radius: 14px;

            outline: none;

            background: #151520;
            color: white;

            font-size: 16px;
        }

        .search-box input:focus {
            border-color: #ffcc33;
        }

        .search-box button {
            padding: 0 22px;

            border: none;
            border-radius: 14px;

            background: #ffcc33;
            color: #111;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .search-box button:hover {
            transform: translateY(-2px);
        }

        /* =========================
           CATEGORÍAS
        ========================= */

        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;

            margin-bottom: 35px;
        }

        .category {
            padding: 10px 16px;

            border: 1px solid #292936;
            border-radius: 999px;

            background: #151520;
            color: #ddd;

            cursor: pointer;
            transition: 0.2s;
        }

        .category:hover,
        .category.active {
            background: #ffcc33;
            color: #111;
            border-color: #ffcc33;
        }

        /* =========================
           JUEGOS
        ========================= */

        .games {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(190px, 1fr));

            gap: 18px;
        }

        .game {
            background: #151520;

            border: 1px solid #292936;
            border-radius: 18px;

            padding: 15px;

            transition: 0.2s;

            cursor: pointer;
        }

        .game:hover {
            transform: translateY(-5px);

            border-color: #ffcc33;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .game-image {
            width: 100%;
            aspect-ratio: 16 / 10;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #27273a,
                    #101018
                );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 45px;

            margin-bottom: 12px;
        }

        .game h3 {
            font-size: 17px;
            margin-bottom: 5px;
        }

        .game p {
            color: #888;
            font-size: 13px;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            padding: 40px 20px;

            margin-top: 50px;

            color: #777;

            border-top: 1px solid #20202b;
        }

        footer strong {
            color: #ffcc33;
        }

        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 600px) {

            .retroyer-banner {
                height: 180px;
                border-radius: 0 0 18px 18px;
            }

            main {
                width: 92%;
                margin-top: 25px;
            }

            .hero h1 {
                letter-spacing: -2px;
            }

            .hero p {
                font-size: 15px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box button {
                height: 48px;
            }

            .games {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 12px;
            }

            .game {
                padding: 10px;
                border-radius: 14px;
            }

            .game h3 {
                font-size: 14px;
            }

            .game p {
                font-size: 12px;
            }
        }

        @media (max-width: 360px) {
            .games {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- =================================
         BANNER DECO CANDY
    ================================== -->

    <section class="retroyer-banner">

        <iframe
            src="https://retroyer.com/echo/deco?name=candy"
            title="Retroyer Candy Deco"
            loading="eager"
            scrolling="no">
        </iframe>

        <div class="banner-overlay"></div>

    </section>


    <!-- =================================
         CONTENIDO PRINCIPAL
    ================================== -->

    <main>

        <section class="hero">

            <h1>
                RETRO<span>YER</span>
            </h1>

            <p>
                Juegos retro, clásicos y mucho más.
            </p>

        </section>


        <!-- BUSCADOR -->

        <div class="search-box">

            <input
                type="text"
                id="search"
                placeholder="🔎 Buscar juegos..."
                autocomplete="off">

            <button onclick="searchGames()">
                Buscar
            </button>

        </div>


        <!-- CATEGORÍAS -->

        <div class="categories">

            <button class="category active"
                    onclick="filterGames('all', this)">
                Todos
            </button>

            <button class="category"
                    onclick="filterGames('arcade', this)">
                🕹️ Arcade
            </button>

            <button class="category"
                    onclick="filterGames('action', this)">
                ⚔️ Acción
            </button>

            <button class="category"
                    onclick="filterGames('racing', this)">
                🏎️ Carreras
            </button>

            <button class="category"
                    onclick="filterGames('puzzle', this)">
                🧩 Puzzle
            </button>

        </div>


        <!-- JUEGOS -->

        <section class="games" id="games">

            <article class="game"
                     data-name="Pac-Man"
                     data-category="arcade">

                <div class="game-image">
                    🟡
                </div>

                <h3>Pac-Man</h3>
                <p>Arcade clásico</p>

            </article>


            <article class="game"
                     data-name="Super Mario"
                     data-category="action">

                <div class="game-image">
                    🍄
                </div>

                <h3>Super Mario</h3>
                <p>Aventura clásica</p>

            </article>


            <article class="game"
                     data-name="Tetris"
                     data-category="puzzle">

                <div class="game-image">
                    🧱
                </div>

                <h3>Tetris</h3>
                <p>Puzzle clásico</p>

            </article>


            <article class="game"
                     data-name="Racing"
                     data-category="racing">

                <div class="game-image">
                    🏎️
                </div>

                <h3>Racing</h3>
                <p>Carreras retro</p>

            </article>


            <article class="game"
                     data-name="Space Shooter"
                     data-category="arcade">

                <div class="game-image">
                    🚀
                </div>

                <h3>Space Shooter</h3>
                <p>Arcade espacial</p>

            </article>


            <article class="game"
                     data-name="Puzzle Blocks"
                     data-category="puzzle">

                <div class="game-image">
                    🧩
                </div>

                <h3>Puzzle Blocks</h3>
                <p>Rompecabezas</p>

            </article>

        </section>

    </main>


    <!-- =================================
         FOOTER
    ================================== -->

    <footer>

        <strong>Retroyer</strong>

        <br>

        Juegos retro para todos.

        <br><br>

        © 2026 Retroyer

    </footer>


    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script>

        const searchInput =
            document.getElementById("search");

        const games =
            document.querySelectorAll(".game");


        function searchGames() {

            const text =
                searchInput.value
                .toLowerCase()
                .trim();

            games.forEach(game => {

                const name =
                    game.dataset.name.toLowerCase();

                game.style.display =
                    name.includes(text)
                    ? ""
                    : "none";

            });

        }


        searchInput.addEventListener(
            "input",
            searchGames
        );


        function filterGames(category, button) {

            document
                .querySelectorAll(".category")
                .forEach(btn => {
                    btn.classList.remove("active");
                });

            button.classList.add("active");


            games.forEach(game => {

                if (
                    category === "all" ||
                    game.dataset.category === category
                ) {

                    game.style.display = "";

                } else {

                    game.style.display = "none";

                }

            });

        }

    </script>

</body>
</html>

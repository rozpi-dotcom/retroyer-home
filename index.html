<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Retroyer — Juegos HTML5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#070a11;color:#fff}body{overflow-x:hidden}button,input{font:inherit}header{position:sticky;top:0;z-index:20;background:#0b101af2;backdrop-filter:blur(15px);border-bottom:1px solid #202b3d}.nav,.hero,.categories,.content{max-width:1400px;margin:auto}.nav{padding:15px 20px;display:flex;align-items:center;gap:20px}.logo{font-size:28px;font-weight:900;color:#00eaff}.logo span{color:#fff}.search{flex:1}.search input{width:100%;padding:13px 17px;border-radius:12px;border:1px solid #29364b;background:#111722;color:#fff;outline:0}.search input:focus{border-color:#00eaff}.hero{margin-top:25px;padding:55px 30px;border-radius:22px;background:radial-gradient(circle at 80% 20%,#0066ff55,transparent 35%),radial-gradient(circle at 20% 80%,#00eaff25,transparent 35%),#101827}.hero h1{font-size:clamp(40px,7vw,75px);margin:0 0 10px}.hero h1 span{color:#00eaff}.hero p{color:#98a6bb;font-size:18px}.categories{padding:0 20px 25px;display:flex;gap:9px;overflow-x:auto}.category{border:1px solid #29364b;background:#111722;color:#aab7c9;border-radius:30px;padding:10px 16px;cursor:pointer;white-space:nowrap}.category.active,.category:hover{background:#00eaff;color:#001014}.content{padding:0 20px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}#count{color:#748197}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}.card{background:#111722;border:1px solid #202c3e;border-radius:15px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-5px);border-color:#00eaff}.cover{height:125px;display:grid;place-items:center;font-size:55px;background:linear-gradient(135deg,#16253b,#0b1019)}.info{padding:13px}.info h3{margin:0}.info p{margin:7px 0 0;color:#718098;font-size:13px}.tag{display:inline-block;margin-top:9px;padding:4px 8px;border-radius:6px;background:#1a2638;color:#91a3bd;font-size:11px}#player{display:none;position:fixed;inset:0;z-index:100;background:#05070c;padding:10px}.playerBox{width:min(1100px,100%);height:100%;margin:auto;display:flex;flex-direction:column}.playerHead{min-height:48px;display:flex;justify-content:space-between;align-items:center}.close{border:0;border-radius:9px;background:#1b2535;color:#fff;padding:9px 15px;cursor:pointer}.gameCanvas{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}canvas{width:min(800px,100%);height:auto;aspect-ratio:800/500;background:#05070b;border:1px solid #27354a;border-radius:12px;touch-action:none}.controlsText{text-align:center;padding:7px;color:#8391a6;font-size:13px}.touchControls{display:none;width:min(420px,100%);margin:auto;padding:8px 5px 12px;user-select:none}.touchGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:230px;margin:auto}.touchBtn,.actionBtn{min-height:58px;border:1px solid #34445c;border-radius:14px;background:#172236;color:#fff;font-size:25px;cursor:pointer;touch-action:none}.touchBtn:active,.actionBtn:active{background:#00eaff;color:#001014}.touchBtn.empty{visibility:hidden}.actionRow{display:flex;justify-content:center;margin-top:8px}.actionBtn{min-width:130px}@media(max-width:700px){header{position:relative}.nav{flex-wrap:wrap;padding:12px}.logo{width:100%}.hero{margin:15px 10px;padding:35px 20px}.hero p{font-size:15px}.content,.categories{padding-left:10px;padding-right:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cover{height:95px;font-size:43px}.info{padding:10px}.info h3{font-size:14px}.gameCanvas{flex:none;width:100%}.touchControls{display:block}#player{padding:5px}.controlsText{font-size:11px}}@media(min-width:701px){.touchControls{display:none!important}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">RETRO<span>YER</span></div><div class="search"><input id="search" placeholder="🔎 Buscar juegos..." aria-label="Buscar juegos"></div></div></header>
<section class="hero"><h1>Juega <span>sin límites.</span></h1><p>Juegos HTML5 para PC, Android y iPhone.</p></section>
<div class="categories"><button class="category active" data-cat="Todos">🔥 Todos</button><button class="category" data-cat="Arcade">🕹️ Arcade</button><button class="category" data-cat="Acción">⚡ Acción</button><button class="category" data-cat="Puzzle">🧩 Puzzle</button><button class="category" data-cat="Clásicos">👾 Clásicos</button></div>
<main class="content"><div class="top"><h2>🎮 Juegos</h2><span id="count"></span></div><div class="grid" id="grid"></div></main>
<div id="player"><div class="playerBox"><div class="playerHead"><strong id="gameTitle">Juego</strong><button class="close" id="close">✕ Cerrar</button></div><div class="gameCanvas"><canvas id="canvas" width="800" height="500"></canvas></div><div class="controlsText" id="controlsText"></div><div class="touchControls"><div class="touchGrid"><button class="touchBtn empty">•</button><button class="touchBtn" data-key="up">▲</button><button class="touchBtn empty">•</button><button class="touchBtn" data-key="left">◀</button><button class="touchBtn" data-key="down">▼</button><button class="touchBtn" data-key="right">▶</button></div><div class="actionRow"><button class="actionBtn" data-key="space">🚀 DISPARAR</button></div></div></div></div>
<script>
const names=['Astro Clash','Neon Drift','Pixel Pursuit','Turbo Circuit','Cosmic Vault','Jungle Dash','Sky Runner','Block Breaker','Rocket Raid','Marble Quest','Crystal Storm','Forest Hop','Flash Frenzy','Lunar Echo','Solar Sprint','Deep Dive','Rainbow Grid','Pirate Panic','Robot Run','Bomb Bouncer','Gem Hunter','Orbit Leap','Mountain Dash','Night Shift','Pirate Harbor','Echo Runner','Cyber Sprint','Steel Storm','Mini Mayhem','Catapult Quest','Piston Panic','Time Tunnel','Frost Glide','Sunset Rush','Danger Pulse','Prism Shift','Domino Drift','Moon Beam','Hyper Burst','Orbit Rally','Magnetic Maze','Star Harbor','Dark Circuit','Firestorm','Wild Pattern','Candy Blitz','Pixel Punch','Comet Chase','Rescue Rover','Rainbow Quest','Ninja Flip','Thunder Loop','Desert Drift','Galaxy Spin','Shadow Path','Prism Portal','Ice Vector','Jungle Runner','Cave Sprint','Signal Surge','Rocket Flip','Monster Chase','Light Sprint','River Rush','Planet Hopper','Turbo Pistol','Snowbound','Color Break','Dragon Dive','Neon Orbit','Bubble Burst','Stone Run','Hyper Hopper','Crystal Runner','Storm Cruiser','Micro Arena','Titan Pulse','Escape Park','Paper Trail','Frost Fury','Puzzle Pulse','Lantern Dash','Blue Orbit','Steel Wave','Silver Drift','Jungle Circuit','Neon Nova','Solar Runner','Cosmic Sparks','Turbo Trail','Moon Circuit','Dragon Rift','Prism Runner','Pixel Harbor','Rocket Lotus','Mirage Run','Storm Gate','Luna Drift','Velocity Run','Thunder Drift'];
const cats=['Arcade','Acción','Puzzle','Clásicos'],icons=['🎮','👾','🚀','⚡','🧩','🏎️','🤖','🌌','💎','🔥'],types=['snake','pong','dodge','clicker','space'];
const games=names.map((name,i)=>({name,cat:cats[i%4],icon:icons[i%10],type:types[i%5]}));
const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count'),player=document.getElementById('player'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),controls=document.getElementById('controlsText');let category='Todos',animation=0,keys={up:false,down:false,left:false,right:false,space:false};
function render(){const q=search.value.trim().toLowerCase(),result=games.filter(g=>(category==='Todos'||g.cat===category)&&g.name.toLowerCase().includes(q));grid.innerHTML='';result.forEach(g=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="cover">${g.icon}</div><div class="info"><h3>${g.name}</h3><p>HTML5 • PC + móvil</p><span class="tag">${g.cat}</span></div>`;card.onclick=()=>openGame(g);grid.appendChild(card)});count.textContent=`${result.length} juegos`}
function openGame(g){player.style.display='block';document.getElementById('gameTitle').textContent=g.name;cancelAnimationFrame(animation);canvas.onclick=null;({snake,pong,dodge,clicker,space}[g.type]||dodge)()}
function closeGame(){player.style.display='none';cancelAnimationFrame(animation);canvas.onclick=null;ctx.clearRect(0,0,800,500);keys={up:false,down:false,left:false,right:false,space:false}}
document.getElementById('close').onclick=closeGame;
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(e.key==='ArrowUp'||k==='w')keys.up=true;if(e.key==='ArrowDown'||k==='s')keys.down=true;if(e.key==='ArrowLeft'||k==='a')keys.left=true;if(e.key==='ArrowRight'||k==='d')keys.right=true;if(e.code==='Space'){e.preventDefault();keys.space=true}if(e.key==='Escape')closeGame()});document.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(e.key==='ArrowUp'||k==='w')keys.up=false;if(e.key==='ArrowDown'||k==='s')keys.down=false;if(e.key==='ArrowLeft'||k==='a')keys.left=false;if(e.key==='ArrowRight'||k==='d')keys.right=false;if(e.code==='Space')keys.space=false});document.querySelectorAll('.touchBtn,.actionBtn').forEach(b=>{const k=b.dataset.key,down=e=>{e.preventDefault();if(k)keys[k]=true},up=e=>{e.preventDefault();if(k)keys[k]=false};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,up))});
function snake(){controls.textContent='PC: WASD/Flechas • Móvil: botones';let x=400,y=250;function loop(){animation=requestAnimationFrame(loop);if(keys.up)y-=4;if(keys.down)y+=4;if(keys.left)x-=4;if(keys.right)x+=4;x=Math.max(10,Math.min(790,x));y=Math.max(10,Math.min(490,y));ctx.fillStyle='#05070b';ctx.fillRect(0,0,800,500);ctx.fillStyle='#00eaff';ctx.fillRect(x-10,y-10,20,20)}loop()}
function pong(){controls.textContent='PC: W/S • Móvil: ▲/▼';let y=210,x=400,by=240,vx=4,vy=3;function loop(){animation=requestAnimationFrame(loop);if(keys.up)y-=7;if(keys.down)y+=7;y=Math.max(0,Math.min(420,y));x+=vx;by+=vy;if(by<0||by>480)vy*=-1;if(x<45&&by>y&&by<y+80)vx=Math.abs(vx);if(x>790||x<0)vx*=-1;ctx.fillStyle='#05070b';ctx.fillRect(0,0,800,500);ctx.fillStyle='#00eaff';ctx.fillRect(20,y,20,80);ctx.fillStyle='#fff';ctx.fillRect(760,240,20,80);ctx.beginPath();ctx.arc(x,by,10,0,Math.PI*2);ctx.fill()}loop()}
function dodge(){controls.textContent='PC: A/D • Móvil: ◀/▶';let x=380;function loop(){animation=requestAnimationFrame(loop);if(keys.left)x-=7;if(keys.right)x+=7;x=Math.max(0,Math.min(760,x));ctx.fillStyle='#05070b';ctx.fillRect(0,0,800,500);ctx.fillStyle='#00eaff';ctx.fillRect(x,450,40,25);ctx.fillStyle='#ff4050';ctx.fillRect(380,120,25,25)}loop()}
function clicker(){controls.textContent='Toca el círculo para conseguir puntos';let score=0;function draw(){ctx.fillStyle='#05070b';ctx.fillRect(0,0,800,500);ctx.fillStyle='#fff';ctx.font='30px Arial';ctx.fillText('Puntos: '+score,30,50);ctx.fillStyle='#00eaff';ctx.beginPath();ctx.arc(400,250,70,0,Math.PI*2);ctx.fill()}canvas.onclick=()=>{score++;draw()};draw()}
function space(){controls.textContent='PC: A/D + ESPACIO • Móvil: botones';let x=380;function loop(){animation=requestAnimationFrame(loop);if(keys.left)x-=6;if(keys.right)x+=6;x=Math.max(0,Math.min(760,x));ctx.fillStyle='#05070b';ctx.fillRect(0,0,800,500);ctx.fillStyle='#00eaff';ctx.fillRect(x,450,40,25);ctx.fillStyle='#ff4050';ctx.fillRect(350,100,30,30)}loop()}
document.querySelectorAll('.category').forEach(b=>b.onclick=()=>{category=b.dataset.cat;document.querySelectorAll('.category').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});search.addEventListener('input',render);render();
</script>
</body>
</html>

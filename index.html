canvas{width:min(800px,100%);height:auto;aspect-ratio:800/500;background:#05070b;border:1px solid #27354a;border-radius:12px;touch-action:none}

</style>

const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count'),
player=document.getElementById('player'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),
controls=document.getElementById('controlsText');
let category='Todos',animation=0,keys={up:false,down:false,left:false,right:false,space:false},current=null;

function render(){
 const q=search.value.trim().toLowerCase();
 const result=games.filter(g=>g.name.toLowerCase().includes(q));
 grid.innerHTML='';
 result.forEach(g=>{
  const card=document.createElement('article');card.className='card';
  card.innerHTML=`<div class="cover">${g.icon}</div><div class="info"><h3>${g.name}</h3><p>${g.desc}</p><span class="tag">Juego único #${g.id}</span></div>`;
  card.onclick=()=>openGame(g);grid.appendChild(card);
 });
 count.textContent=`${result.length} de ${games.length} juegos`;
}

function openGame(g){
 player.style.display='block';current=g;
 document.getElementById('gameTitle').textContent=g.name;
 cancelAnimationFrame(animation);canvas.onclick=null;
 startGame(g);
}

function closeGame(){
 player.style.display='none';cancelAnimationFrame(animation);canvas.onclick=null;
 ctx.clearRect(0,0,800,500);keys={up:false,down:false,left:false,right:false,space:false};
}
document.getElementById('close').onclick=closeGame;

document.addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(e.key==='ArrowUp'||k==='w')keys.up=true;if(e.key==='ArrowDown'||k==='s')keys.down=true;
 if(e.key==='ArrowLeft'||k==='a')keys.left=true;if(e.key==='ArrowRight'||k==='d')keys.right=true;
 if(e.code==='Space'){e.preventDefault();keys.space=true}if(e.key==='Escape')closeGame();
});
document.addEventListener('keyup',e=>{
 const k=e.key.toLowerCase();
 if(e.key==='ArrowUp'||k==='w')keys.up=false;if(e.key==='ArrowDown'||k==='s')keys.down=false;
 if(e.key==='ArrowLeft'||k==='a')keys.left=false;if(e.key==='ArrowRight'||k==='d')keys.right=false;
 if(e.code==='Space')keys.space=false;
});
document.querySelectorAll('.touchBtn,.actionBtn').forEach(b=>{
 const k=b.dataset.key,down=e=>{e.preventDefault();if(k)keys[k]=true},up=e=>{e.preventDefault();if(k)keys[k]=false};
 b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,up));
});

function startGame(g){
 const mode=g.mode, W=800,H=500;
 let x=400,y=400,score=0,t=0,objects=[],goal=null,vel=0,angle=0;
 const colors=['#00eaff','#ff4050','#ffd84a','#72ff7a','#a878ff','#ff7ad9'];

 function clear(){ctx.fillStyle='#05070b';ctx.fillRect(0,0,W,H)}
 function text(s,x,y,size=24){ctx.fillStyle='#fff';ctx.font=size+'px Arial';ctx.fillText(s,x,y)}
 function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
 function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
 function dist(a,b,c,d){return Math.hypot(a-c,b-d)}
 function rand(n){return Math.random()*n}

 controls.textContent='PC: WASD/Flechas + ESPACIO • Móvil: botones';

 // Each mode below has its own rule/objective.
 function loop(){
  animation=requestAnimationFrame(loop);t++;
  clear();

  if(mode==='arcade'||mode==='shooter'){
   if(keys.left)x-=5;if(keys.right)x+=5;x=Math.max(20,Math.min(780,x));
   if(t%35===0)objects.push({x:rand(760)+20,y:-20,v:2+rand(3)});
   objects.forEach(o=>{o.y+=o.v;circle(o.x,o.y,12,'#ff4050')});
   rect(x-20,450,40,25,'#00eaff');
   objects=objects.filter(o=>o.y<530);
   text('Puntos: '+score,20,35); if(keys.space&&t%10===0)score++;
  } else if(mode==='racer'||mode==='racer2'||mode==='desert'||mode==='lunarcar'){
   x=400+Math.sin(t/30)*170;if(keys.left)x-=4;if(keys.right)x+=4;
   rect(x-22,420,44,60,'#00eaff');
   for(let i=0;i<8;i++){let yy=(i*80+t*5)%560-60;rect(200+(i%3)*120,yy,35,50,'#ff4050')}
   text('Distancia: '+Math.floor(t/10),20,35);
  } else if(mode==='runner'||mode==='lanes'||mode==='prun'||mode==='jungle'){
   if(keys.left)x-=6;if(keys.right)x+=6;if(keys.up)y-=7;y+=3;x=Math.max(20,Math.min(760,x));y=Math.min(450,y);
   rect(x,420,35,30,'#00eaff');
   for(let i=0;i<6;i++)rect((i*137+t*2)%800,380-(i%3)*55,40,20,'#ff4050');
   text('Corre: '+Math.floor(t/10),20,35);
  } else if(mode==='brick'||mode==='bounce'){
   x=400+Math.sin(t/20)*220;circle(x,150+Math.sin(t/12)*100,14,'#00eaff');
   for(let i=0;i<10;i++)rect(80+i*65,60+(i%2)*35,55,20,colors[i%colors.length]);
   rect(x-45,450,90,15,'#fff');text('Rebotes: '+Math.floor(t/20),20,35);
  } else if(mode==='catch'||mode==='bubbles'||mode==='rings'){
   if(keys.left)x-=7;if(keys.right)x+=7;x=Math.max(25,Math.min(775,x));
   rect(x-35,445,70,20,'#00eaff');
   if(t%25===0)objects.push({x:rand(760)+20,y:-10});
   objects.forEach(o=>{o.y+=4;circle(o.x,o.y,14,colors[Math.floor(rand(colors.length))])});
   objects=objects.filter(o=>o.y<520);text('Objetos: '+objects.length,20,35);
  } else if(mode==='reflex'||mode==='target'||mode==='whack'){
   if(!goal||t%70===0)goal={x:rand(700)+50,y:rand(350)+70};
   circle(goal.x,goal.y,35,'#00eaff');text('¡Pulsa el objetivo!',270,35);
   if(keys.space&&dist(400,250,goal.x,goal.y)<80){score++;goal=null}
   text('Puntos: '+score,20,475);
  } else if(mode==='memory'||mode==='signal'||mode==='sequence'){
   const n=4+Math.floor(t/120)%4; text('Memoriza la secuencia: '+Array.from({length:n},(_,i)=>i+1).join(' → '),150,220);
   text('Pulsa ESPACIO cuando termines',240,280);if(keys.space)score++;
   text('Rondas: '+score,20,35);
  } else if(mode==='timer'||mode==='solar'||mode==='light'){
   const remain=Math.max(0,30-Math.floor(t/60));text('Tiempo: '+remain,330,55,32);
   for(let i=0;i<5;i++){circle(100+i*150,250,45,(Math.floor(t/20)+i)%2?'#18263a':'#ffd84a')}
   if(keys.space)score++;
   text('Puntos: '+score,20,475);
  } else if(mode==='dive'||mode==='climb'||mode==='cave'){
   y=80+(t%380);if(keys.up)y-=6;if(keys.down)y+=6;
   circle(400,y,18,'#00eaff');for(let i=0;i<7;i++)rect(80+i*110,120+(i%2)*170,35,120,'#ff4050');
   text('Profundidad: '+Math.floor(y),20,35);
  } else if(mode==='connect'||mode==='circuit'||mode==='sparks'||mode==='switches'){
   for(let i=0;i<8;i++){circle(100+i*85,200+(i%2)*120,22,colors[i%6]);}
   rect(300,430,200,35,'#172236');text('Conecta los nodos en orden',255,455,18);
   if(keys.space)score++;text('Conexiones: '+score,20,35);
  } else if(mode==='defense'||mode==='base'||mode==='cruiser'||mode==='wave'){
   x=400;if(keys.left)x-=6;if(keys.right)x+=6;rect(x-30,430,60,30,'#00eaff');
   for(let i=0;i<9;i++){let xx=(i*97+t*4)%850-25;rect(xx,70+(i%3)*100,25,55,'#ff4050')}
   text('Base: '+Math.max(0,100-Math.floor(t/50))+'%',20,35);
  } else if(mode==='mines'||mode==='escape'||mode==='maze'){
   if(keys.left)x-=5;if(keys.right)x+=5;if(keys.up)y-=5;if(keys.down)y+=5;
   x=Math.max(20,Math.min(780,x));y=Math.max(60,Math.min(460,y));circle(x,y,16,'#00eaff');
   for(let i=0;i<10;i++)circle(70+i*75,100+(i%4)*80,12,'#ff4050');
   text('Encuentra la salida →',300,35);
  } else if(mode==='fuel'||mode==='satellite'||mode==='velocity'){
   if(keys.left)x-=4;if(keys.right)x+=4;if(keys.up)y-=4;if(keys.down)y+=4;
   circle(x,y,18,'#00eaff');circle(400,250,150,'#172236');circle(400,250,155,'#29364b');
   text('Energía: '+Math.max(0,100-Math.floor(t/40)),20,35);
  } else if(mode==='angle'||mode==='catapult'){
   let a=((t%120)/120)*Math.PI;rect(100,420,60,20,'#00eaff');
   rect(150,410,5,-Math.sin(a)*100,'#fff');circle(600,350,30,'#ff4050');text('Ajusta el ángulo y pulsa ESPACIO',220,35,20);
   if(keys.space)score++;text('Intentos: '+score,20,475);
  } else if(mode==='timing'||mode==='pulse'||mode==='thunder'){
   for(let i=0;i<8;i++){let on=((t+i*20)%100)<45;rect(70+i*90,200,55,100,on?'#ff4050':'#172236')}
   rect(x-15,330,30,30,'#00eaff');if(keys.left)x-=5;if(keys.right)x+=5;
   text('Cruza cuando las barreras estén apagadas',180,70);
  } else if(mode==='ice'||mode==='slide'||mode==='vector'){
   if(keys.left)vel=-5;if(keys.right)vel=5;if(keys.up)vel=-5;if(keys.down)vel=5;
   x+=vel;y+=vel;vel*=.97;x=Math.max(20,Math.min(780,x));y=Math.max(80,Math.min(460,y));
   circle(x,y,20,'#00eaff');rect(650,400,90,50,'#72ff7a');text('Llega a la zona verde',290,35);
  } else {
   if(keys.left)x-=5;if(keys.right)x+=5;if(keys.up)y-=5;if(keys.down)y+=5;
   x=Math.max(20,Math.min(780,x));y=Math.max(70,Math.min(460,y));circle(x,y,20,'#00eaff');
   circle(650,400,35,'#72ff7a');text(g.desc,20,35,18);text('Puntos: '+score,20,475);
   if(dist(x,y,650,400)<50)score++;
  }
 }
 loop();
}

document.querySelectorAll('.category').forEach(b=>b.onclick=()=>{
 category=b.dataset.cat;document.querySelectorAll('.category').forEach(x=>x.classList.remove('active'));b.classList.add('active');render();
});
search.addEventListener('input',render);
render();
</script>
</body>
</html>
